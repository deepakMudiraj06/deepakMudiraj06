<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Deepak Mudiraj — Data Science and AI</title>
  <desc id="desc">Animated dark gradient banner with a futuristic grid, glowing particles, and Deepak Mudiraj's profile headline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B16"/>
      <stop offset="0.55" stop-color="#10172A"/>
      <stop offset="1" stop-color="#25124A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1200" height="350" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="24" fill="url(#grid)"/>
  <ellipse cx="1040" cy="35" rx="210" ry="130" fill="#8B5CF6" opacity=".18" filter="url(#soft)">
    <animate attributeName="cx" values="1040;930;1040" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="170" cy="330" rx="250" ry="105" fill="#22D3EE" opacity=".12" filter="url(#soft)">
    <animate attributeName="cy" values="330;270;330" dur="10s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M0 278 C220 210 310 330 520 254 S850 150 1200 235" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="2"/>
  <path d="M0 292 C220 224 310 344 520 268 S850 164 1200 249" fill="none" stroke="#A78BFA" stroke-opacity=".15" stroke-width="8" filter="url(#glow)"/>
  <g fill="#67E8F9" filter="url(#glow)">
    <circle cx="108" cy="82" r="2"><animate attributeName="cy" values="82;64;82" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="126" r="2"><animate attributeName="cx" values="1030;1062;1030" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="286" r="2"><animate attributeName="cy" values="286;264;286" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="252" r="2"><animate attributeName="cx" values="260;290;260" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".7">
    <path d="M1040 64l28 16-28 16-28-16z"><animateTransform attributeName="transform" type="rotate" from="0 1040 80" to="360 1040 80" dur="18s" repeatCount="indefinite"/></path>
    <path d="M150 236l20 12-20 12-20-12z"><animateTransform attributeName="transform" type="rotate" from="360 150 248" to="0 150 248" dur="14s" repeatCount="indefinite"/></path>
  </g>
  <rect x="74" y="58" width="1052" height="234" rx="18" fill="#080B16" fill-opacity=".26" stroke="url(#accent)" stroke-opacity=".5"/>
  <text x="600" y="143" text-anchor="middle" fill="url(#text)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="3">HELLO, I'M DEEPAK MUDIRAJ</text>
  <text x="600" y="188" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="4">DATA SCIENCE  •  ARTIFICIAL INTELLIGENCE  •  MACHINE LEARNING</text>
  <rect x="440" y="222" width="320" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="230;360;230" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="485;420;485" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
